# Klíčová slova pro levný předfiltr (bez LLM).
# Porovnává se s textem BEZ DIAKRITIKY a malými písmeny, takže pište kmeny bez háčků a čárek.
# Pozor na vkladné e v češtině: 'čerpadlo' → 'čerpadel', proto kmen 'cerpad' (ne 'cerpadl').
#  - stems: shoda na ZAČÁTKU slova (kmen), víceslovné fráze = každé slovo jako kmen, v pořadí za sebou
#  - exact: shoda na CELÉ slovo (zkratky jako ETS, OZE)
# Zdroje s topic_filter: false projdou vždy; ostatní musí mít aspoň jednu shodu.


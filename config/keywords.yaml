# Kategorie pro heuristické skórování (dry-run a záloha, když LLM není k dispozici).
categories:
  public_attitudes: [postoj, verejn mineni, pruzkum, public opinion, attitude, survey, poll, acceptance, akceptac, podpor verejnosti, public support]
  communication: [komunikac, narativ, dezinformac, messaging, framing, narrative, misinformation, disinformation, communicat]
  forecast: [forecast, outlook, scenario, prognoz, scenar, projection, vyhled]
  just_transition: [spravedliv transformac, spravedliv prechod, energetick chudob, energeticky chudob, just transition, energy poverty, fuel poverty, uheln region]
  energy_markets: [cena elektrin, ceny elektrin, ceny energi, cena energi, electricity price, energy price, power market, povolenk, trh s elektrin]
  decarbonization_policy: [ets, ets2, cbam, zelen dohod, green deal, climate policy, klimaticka politik, regulac, zakon, legislat, directive, smernic]
  technology: [fotovolt, solarn, vetrn, jadern, tepeln cerpad, heat pump, hydrogen, vodik, nuclear, solar, wind, batter, bateri, smr]
  study: [studie, study, analyz, analysis, report, zprava, paper, research, vyzkum]

# Položky, jejichž titulek odpovídá některému vzoru, se vždy vyřadí (inzeráty, sbírky, akce).
exclude_title_patterns:
  - "hledame"
  - "volna pozice"
  - "volne misto"
  - "pracovni pozic"
  - "nabidka prace"
  - "pridej se k nam"
  - "prijmeme"

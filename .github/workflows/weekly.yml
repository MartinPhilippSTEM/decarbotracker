name: weekly

on:
  schedule:
    # Cron v GitHub Actions běží vždy v UTC. Pondělí 00:17 UTC = 02:17 letního času (SELČ) / 01:17 zimního (SEČ).
    # GitHub plánované běhy spouští „podle možností“ a občas je vynechá (stalo se 5. 10. 2026), proto
    # opakované pokusy každých 30 min do rána + dva pozdější. První úspěšný přehled ostatní pokusy přeskočí
    # (krok „Je už týden hotový?“ – bez instalace, bez AI, bez e-mailu). Liché minuty kvůli špičkám.
    - cron: '17 0 * * 1'
    - cron: '47 0 * * 1'
    - cron: '17 1 * * 1'
    - cron: '47 1 * * 1'
    - cron: '17 2 * * 1'
    - cron: '47 2 * * 1'
    - cron: '17 3 * * 1'
    - cron: '47 3 * * 1'
    - cron: '17 4 * * 1'
    - cron: '47 4 * * 1'
    - cron: '47 7 * * 1'
    - cron: '23 11 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO týden ve tvaru YYYY-Www, např. 2026-W39 (prázdné = týden, který právě skončil)'
        required: false
        default: ''
  # Lokální "run" pošle data do repa / změna vzhledu → tady se jen znovu sestaví a nasadí web (bez AI).
  push:
    branches: [main]
    paths:
      - 'data/weeks/**'
      - 'templates/**'
      - 'static/**'

permissions:
  contents: write   # commit dat zpět do repozitáře
  pages: write      # nasazení na GitHub Pages
  id-token: write   # ověření nasazení Pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # U plánovaných pokusů: když už je přehled za uplynulý týden hotový (stav ok), vše ostatní se přeskočí.
      - name: Je už týden hotový?
        id: done
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, pathlib
          y, w, _ = (datetime.datetime.now(datetime.UTC) - datetime.timedelta(days=7)).isocalendar()
          p = pathlib.Path(f"data/weeks/{y}-W{w:02d}.json")
          done = p.exists() and json.loads(p.read_text(encoding="utf-8")).get("status") == "ok"
          print(f"skip={'true' if done else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.done.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalace
        if: steps.done.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Nastavení Pages
        id: pages
        if: steps.done.outputs.skip != 'true'
        uses: actions/configure-pages@v6

      - name: Kontrola API klíče (hodnota se nevypisuje)
        if: github.event_name != 'push' && steps.done.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m decarbotracker check-key

      - name: Týdenní pipeline
        id: run
        if: github.event_name != 'push' && steps.done.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          DECARBO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          ARGS="--no-deploy"
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --skip-if-done"; fi
          if [ -n "$WEEK_INPUT" ]; then
            if ! [[ "$WEEK_INPUT" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
              echo "::error::Neplatný týden '$WEEK_INPUT' (očekávám např. 2026-W39)"; exit 1
            fi
            ARGS="$ARGS --week $WEEK_INPUT"
          fi
          python -m decarbotracker run $ARGS

      - name: Uložení dat do repozitáře
        if: github.event_name != 'push' && steps.done.outputs.skip != 'true'
        env:
          WEEK: ${{ steps.run.outputs.week }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: týden ${WEEK} [skip ci]"
          git pull --rebase
          git push

      - name: Sestavení webu
        if: steps.done.outputs.skip != 'true'
        env:
          DECARBO_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          DECARBO_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          DECARBO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m decarbotracker build

      - uses: actions/upload-pages-artifact@v5
        if: steps.done.outputs.skip != 'true'
        with:
          path: site

      - name: Nasazení na GitHub Pages
        id: deployment
        if: steps.done.outputs.skip != 'true'
        uses: actions/deploy-pages@v5

      # E-mail se 3 zjištěními a návrhem vlákna na X – až po nasazení, aby fungoval odkaz.
      # Selhání e-mailu neshodí běh (web už je nasazený).
      - name: E-mail se zjištěními
        if: github.event_name != 'push' && steps.done.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DECARBO_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          WEEK: ${{ steps.run.outputs.week }}
        run: |
          python -m decarbotracker notify --week "$WEEK"
          git add data/digests/ || true
          git diff --staged --quiet || git commit -m "data: e-mail týden ${WEEK} [skip ci]"
          git pull --rebase
          git push

name: weekly

on:
  schedule:
    # Každé pondělí v 04:17 UTC = 06:17 letního času SELČ (od konce října do března 05:17 SEČ).
    # Cron v GitHub Actions běží vždy v UTC. Lichá minuta (ne celá hodina) snižuje riziko zpoždění ve špičce.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO týden ve tvaru YYYY-Www, např. 2026-W39 (prázdné = týden, který právě skončil)'
        required: false
        default: ''
  # Lokální "run"/"ask" pošle data do repa → tady se jen znovu sestaví a nasadí web (bez nového běhu pipeline).
  push:
    branches: [main]
    paths:
      - 'data/weeks/**'
      - 'data/briefs/**'
      - 'templates/**'
      - 'static/**'

permissions:
  contents: write   # commit dat zpět do repozitáře
  pages: write      # nasazení na GitHub Pages
  id-token: write   # ověření nasazení Pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalace
        run: pip install -r requirements.txt

      - name: Nastavení Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Kontrola API klíče (hodnota se nevypisuje)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m decarbotracker check-key

      - name: Týdenní pipeline
        id: run
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          DECARBO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          ARGS="--no-deploy"
          if [ -n "$WEEK_INPUT" ]; then
            if ! [[ "$WEEK_INPUT" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
              echo "::error::Neplatný týden '$WEEK_INPUT' (očekávám např. 2026-W39)"; exit 1
            fi
            ARGS="$ARGS --week $WEEK_INPUT"
          fi
          python -m decarbotracker run $ARGS

      - name: Uložení dat do repozitáře
        if: github.event_name != 'push'
        env:
          WEEK: ${{ steps.run.outputs.week }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: týden ${WEEK} [skip ci]"
          git pull --rebase
          git push

      - name: Sestavení webu
        env:
          DECARBO_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          DECARBO_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          DECARBO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m decarbotracker build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

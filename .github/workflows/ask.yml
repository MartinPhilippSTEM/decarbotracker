name: ask

# Dotaz na téma kdykoliv během týdne: Actions → ask → Run workflow → napište téma.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Téma dotazu, např. "tepelná čerpadla" nebo "postoje k jádru"'
        required: true
      days:
        description: 'Kolik dní zpět hledat'
        required: false
        default: '14'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalace
        run: pip install -r requirements.txt

      - name: Nastavení Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Dotaz
        id: ask
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          DECARBO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TOPIC: ${{ inputs.topic }}
          DAYS: ${{ inputs.days }}
        run: |
          if ! [[ "$DAYS" =~ ^[0-9]{1,3}$ ]]; then DAYS=14; fi
          python -m decarbotracker ask "$TOPIC" --days "$DAYS" --no-deploy

      - name: Uložení dat do repozitáře
        env:
          SLUG: ${{ steps.ask.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: dotaz ${SLUG} [skip ci]"
          git pull --rebase
          git push

      - name: Sestavení webu
        env:
          DECARBO_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          DECARBO_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          DECARBO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m decarbotracker build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

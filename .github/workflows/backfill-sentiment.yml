name: backfill-sentiment

# Jednorázově doplní odhad nálady k už hotovému přehledu (bez stahování zdrojů; AI ohodnotí jen
# položky přehledu, ~0,02 USD) a znovu nasadí web.
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Týden YYYY-Www, např. 2026-W40'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Nastavení Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Doplnění odhadu nálady
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          if ! [[ "$WEEK_INPUT" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then echo "::error::Neplatný týden"; exit 1; fi
          python -m decarbotracker backfill-sentiment --week "$WEEK_INPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weeks/
          git diff --staged --quiet || git commit -m "data: odhad nálady $WEEK_INPUT [skip ci]"
          git pull --rebase
          git push
      - name: Sestavení webu
        env:
          DECARBO_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          DECARBO_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          DECARBO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m decarbotracker build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
